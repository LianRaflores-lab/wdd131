<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Week 5 | Lianzel Raflores</title>
    <meta name="description" content="WDD 131 Dynamic Web Fundamentals Week 5 assignment practicing website forms">
    <meta name="author" content="Lianzel Raflores">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-small.css">
    <script src="scripts/forms.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <label for="productName">Product Name <span class="required">*</span></label>
            
            <select id="productName" name="productName" required>
                <option value="" selected disabled>--Select a product--</option>
            </select>

            <fieldset class="rating">
                <legend>Overall Rating <span class="required">*</span></legend>

                <input type="radio" id="1star" name="rating" value="1" required>
                <label for="1star">☆</label>

                <input type="radio" id="2star" name="rating" value="2" required>
                <label for="2star">☆☆</label>

                <input type="radio" id="3star" name="rating" value="3" required>
                <label for="3star">☆☆☆</label>

                <input type="radio" id="4star" name="rating" value="4" required>
                <label for="4star">☆☆☆☆</label>

                <input type="radio" id="5star" name="rating" value="5" required>
                <label for="5star">☆☆☆☆☆</label>

            </fieldset>
            

            <label for="date">
                Date of Installation <span class="required">*</span>
            </label>

            <input type="date" id="date" name="date" required>


            <fieldset class="useful">
                <legend>
                    Which features did you find useful in the product?
                </legend>
                <div class="checkbox-item">
                    <input type="checkbox" id="durability" name="durability">
                    <label for="durability">Durability</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="ease" name="ease">
                    <label for="ease">Ease of Use</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="performance" name="performance">
                    <label for="performance">Performance</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="design" name="design">
                    <label for="design">Design</label>
                </div>
            </fieldset>
            
            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review"></textarea>

            <label for="username">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <label><input type="submit" value="Post Review"></label>

        </form>

    </main>

    <footer>
        <p>©<span id="currentyear"></span> 🥥Lianzel Raflores🥥 Philippines</p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
