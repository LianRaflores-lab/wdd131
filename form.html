<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Week 5 | Lianzel Raflores</title>
    <meta name="description" content="WDD 131 Dynamic Web Fundamentals Week 5 assignment practicing website forms">
    <meta name="author" content="Lianzel Raflores">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-small.css">
    <script src="scripts/forms.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <label>Product Name <span id="required">*</span>
                <select id="productName" name="productName" required>
                    <option value="" selected disabled>--Select a product--</option>
                </select>
            </label>

            <fieldset class="rating">
                <legend>Overall Rating <span id="required">*</span></legend>
                <label>
                    <input type="radio" id="1star" name="rating" value="1" required> 
                    ☆
                </label>
                <label>
                    <input type="radio" id="2star" name="rating" value="2"> 
                    ☆☆
                </label>
                <label>
                    <input type="radio" id="3star" name="rating" value="3"> 
                    ☆☆☆
                </label>
                <label>
                    <input type="radio" id="4star" name="rating" value="4"> 
                    ☆☆☆☆
                </label>
                <label>
                    <input type="radio" id="5star" name="rating" value="5"> 
                    ☆☆☆☆☆
                </label>
            </fieldset>

            <label>
                Date of Installation 
                <span id="required">*</span>
            </label>
                <input type="date" id="date" name="date" required>

            <fieldset class="useful">
                <legend>
                    <p>Which features did you find useful in the product?</p>
                    <p>(Check all that apply)</p>
                </legend>
                <label>
                    <input type="checkbox" id="durability" name="durability" value="durability">
                    Durability
                </label>
                <label>
                    <input type="checkbox" id="ease" name="ease" value="ease">
                    Ease of Use
                </label>
                <label>
                    <input type="checkbox" id="performance" name="performance" value="performance">
                    Performance
                </label>
                <label>
                    <input type="checkbox" id="design" name="design" value="design">
                    Design
                </label>
            </fieldset>
            
            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review"></textarea>

            <label for="username">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <label><input type="submit" value="Post Review"></label>

        </form>

    </main>

    <footer>
        <p>©<span id="currentyear"></span> 🥥Lianzel Raflores🥥 Philippines</p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
